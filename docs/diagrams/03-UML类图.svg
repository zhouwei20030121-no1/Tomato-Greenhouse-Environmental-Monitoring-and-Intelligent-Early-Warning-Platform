="13" fill="#bc7933"/><text x="1253" y="948.0" font-size="23" font-weight="700" text-anchor="start" style="fill:white">Command / 模拟指令</text><text x="1253" y="998.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">+id: PK / 幂等键</text><text x="1253" y="1027.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">+event_id: FK</text><text x="1253" y="1056.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">+action, status, ack_time</text><text x="1253" y="1085.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">+人工确认后方能execute()</text><rect x="650" y="915" width="420" height="245" rx="14" fill="white" stroke="#185c90" stroke-width="2"/><rect x="650" y="915" width="420" height="48" rx="12" fill="#185c90"/><rect x="650" y="950" width="420" height="13" fill="#185c90"/><text x="668" y="948.0" font-size="23" font-weight="700" text-anchor="start" style="fill:white">EvidenceAssistant / 助手</text><text x="668" y="998.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">+retriever: HybridRetriever</text><text x="668" y="1027.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">+provider: DeepSeekClient</text><text x="668" y="1056.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">+ask(context, question)</text><text x="668" y="1085.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">+validate_citations()</text><rect x="65" y="915" width="420" height="245" rx="14" fill="white" stroke="#185c90" stroke-width="2"/><rect x="65" y="915" width="420" height="48" rx="12" fill="#185c90"/><rect x="65" y="950" width="420" height="13" fill="#185c90"/><text x="83" y="948.0" font-size="23" font-weight="700" text-anchor="start" style="fill:white">KnowledgeChunk / 知识</text><text x="83" y="998.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">+id, document_id: FK</text><text x="83" y="1027.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">+text, ordinal, source_url</text><text x="83" y="1056.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">+BM25 / TF-IDF索引</text><text x="83" y="1085.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">+可追溯引用ID</text><polyline points="485,280 650,280" fill="none" stroke="#185c90" stroke-width="2.2" marker-end="url(#arrow)" /><text x="567.5" y="268.0" font-size="17" font-weight="400" text-anchor="middle" style="fill:#185c90">1  ──  27</text><polyline points="1070,280 1235,280" fill="none" stroke="#185c90" stroke-width="2.2" marker-end="url(#arrow)" /><text x="1152.5" y="268.0" font-size="17" font-weight="400" text-anchor="middle" style="fill:#185c90">1  ──  0..*</text><polyline points="485,655 650,655" fill="none" stroke="#185c90" stroke-width="2.2" marker-end="url(#arrow)" /><text x="567.5" y="643.0" font-size="17" font-weight="400" text-anchor="middle" style="fill:#185c90">1  ──  0..*</text><polyline points="860,410 860,540" fill="none" stroke="#185c90" stroke-width="2.2" marker-end="url(#arrow)" /><text x="860.0" y="463.0" font-size="17" font-weight="400" text-anchor="middle" style="fill:#185c90">1 / 0..*</text><polyline points="1445,410 1445,540" fill="none" stroke="#185c90" stroke-width="2.2" marker-end="url(#arrow)" /><text x="1445.0" y="463.0" font-size="17" font-weight="400" text-anchor="middle" style="fill:#185c90">触发依据</text><polyline points="1070,655 1235,655" fill="none" stroke="#185c90" stroke-width="2.2" marker-end="url(#arrow)" /><text x="1152.5" y="643.0" font-size="17" font-weight="400" text-anchor="middle" style="fill:#185c90">支持</text><polyline points="1445,785 1445,915" fill="none" stroke="#185c90" stroke-width="2.2" marker-end="url(#arrow)" /><text x="1445.0" y="838.0" font-size="17" font-weight="400" text-anchor="middle" style="fill:#185c90">1 / 0..*</text><polyline points="485,1030 650,1030" fill="none" stroke="#185c90" stroke-width="2.2" marker-end="url(#arrow)" /><text x="567.5" y="1018.0" font-size="17" font-weight="400" text-anchor="middle" style="fill:#185c90">检索 / 引用</text><polyline points="1235,740 1150,740 1150,1030 1070,1030" fill="none" stroke="#185c90" stroke-width="2.2" marker-end="url(#arrow)" /><text x="1152.5" y="873.0" font-size="17" font-weight="400" text-anchor="middle" style="fill:#185c90">解释证据</text><rect x="1740" y="165" width="335" height="995" rx="14" fill="white" stroke="#137c68" stroke-width="2"/><rect x="1740" y="165" width="335" height="48" rx="12" fill="#137c68"/><rect x="1740" y="200" width="335" height="13" fill="#137c68"/><text x="1758" y="198.0" font-size="23" font-weight="700" text-anchor="start" style="fill:white">Service / 服务职责</text><text x="1758" y="248.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">DataImporter</text><text x="1758" y="277.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">  导入真实源文件</text><text x="1758" y="306.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52"></text><text x="1758" y="335.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">ReplayService / Gateway</text><text x="1758" y="364.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">  时间驱动发布与接收</text><text x="1758" y="393.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52"></text><text x="1758" y="422.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">ForecastService</text><text x="1758" y="451.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">  因果窗口 / GRU推理</text><text x="1758" y="480.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52"></text><text x="1758" y="509.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">AlertService</text><text x="1758" y="538.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">  分层判定 / 事件合并</text><text x="1758" y="567.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52"></text><text x="1758" y="596.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">HybridRetriever</text><text x="1758" y="625.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">  BM25 + TF-IDF</text><text x="1758" y="654.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">  RRF + MMR</text><text x="1758" y="683.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52"></text><text x="1758" y="712.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">EventService / Actuator</text><text x="1758" y="741.0" font-size="20" font-weight="400" text-anchor="start" style="fill:#233e52">  状态校验 / 模拟回执</text><text x="65" y="1260.0" font-size="24" font-weight="700" text-anchor="start" style="fill:#185c90">关联约束：温室与节点保持来源独立；观测、预测、指令分表；证据ID关联当前读数、规则与知识片段。</text><text x="65" y="1320.0" font-size="21" font-weight="400" text-anchor="start" style="fill:#233e52">辅助表：sources、replay_state、command_logs、knowledge_documents、chat_messages、settings、jobs。</text><text x="65" y="1370.0" font-size="21" font-weight="400" text-anchor="start" style="fill:#233e52">数据库：SQLite WAL + 外键 + 节点时间索引；前端不持有密钥、不发送任意SQL、不直接调用执行器。</text><text x="55" y="1482.0" font-size="17" font-weight="400" text-anchor="start" style="fill:#61788c">番茄温室环境监测与智能预警平台  ·  真实数据回放 / 软件执行模拟  ·  2026-11-10</text></svg>